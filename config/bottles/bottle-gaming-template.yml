# ArchMerOS Standard Gaming Bottle Template
# Optimized for Windows games, repacks, Unreal Engine 4 titles, and Media Foundation cutscene playback.
#
# Key Features:
# 1. GStreamer hardware NVDEC/Vulkan decoder demotion (fixes black screens and freezes on video playback).
# 2. DXVK + VKD3D-Proton enabled for full DirectX 9-12 translation.
# 3. Fsync synchronization enabled for low-latency kernel threading.
# 4. Discrete GPU preference enabled.

