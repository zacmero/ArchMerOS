general {
    after_sleep_cmd = sh -lc '~/.config/archmeros/scripts/archmeros-hyprctl-dispatch.sh dpms on; ~/.config/archmeros/scripts/archmeros-side-dpms.sh on'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

listener {
    timeout = 900
    on-timeout = /home/zacmero/.config/archmeros/scripts/archmeros-screensaver.sh
    on-resume = /home/zacmero/.config/archmeros/scripts/archmeros-screensaver-stop.sh
}

listener {
    timeout = 1400
    on-timeout = /home/zacmero/.config/archmeros/scripts/archmeros-dpms-off.sh
    on-resume = sh -lc '~/.config/archmeros/scripts/archmeros-hyprctl-dispatch.sh dpms on; ~/.config/archmeros/scripts/archmeros-side-dpms.sh on'
}
